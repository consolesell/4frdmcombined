<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Givan's AI Trading Command Center</title>
    <link rel="icon" href="https://example.com/favicon.ico" type="image/x-icon">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner-large"></div>
        <p>Initializing Command Center...</p>
    </div>

    <!-- Header Section -->
    <header>
        <div class="header-content">
            <div class="logo-section">
                <img src="images/logo.png" alt="Command Center Logo" class="logo">
                <h1>Givan's AI Trading Command Center</h1>
            </div>
            <div class="header-info">
                <div id="live-datetime" class="live-datetime"></div>
                <div id="running-bots-indicator" class="running-bots-indicator">
                    <span class="indicator-label">Active Bots:</span>
                    <span id="active-bots-count" class="active-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <ul id="bot-tabs-list" class="bot-tabs-list">
            <!-- Dynamically generated bot tabs -->
        </ul>
        <div class="nav-controls">
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                <span class="theme-icon">🌙</span>
            </button>
            <button id="settings-toggle" class="settings-toggle" aria-label="Open Settings">
                <span class="settings-icon">⚙️</span>
            </button>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="content-area">
        <div id="loading-spinner" class="loading-spinner"></div>
        
        <!-- Bot iframes container -->
        <div id="bot-frames-container" class="bot-frames-container">
            <!-- Dynamically generated iframes -->
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-overlay" class="settings-overlay"></div>
    <div id="settings-panel" class="settings-panel">
        <div class="settings-header">
            <h2>⚙️ Bot Configuration</h2>
            <button id="close-settings" class="close-settings" aria-label="Close Settings">✕</button>
        </div>
        
        <div class="settings-content">
            <div class="settings-section">
                <h3>Add New Bot</h3>
                <form id="add-bot-form" class="add-bot-form">
                    <div class="form-group">
                        <label for="bot-name-input">Bot Name</label>
                        <input 
                            type="text" 
                            id="bot-name-input" 
                            placeholder="e.g., Scalping Bot" 
                            required
                            autocomplete="off"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="bot-url-input">Bot URL</label>
                        <input 
                            type="url" 
                            id="bot-url-input" 
                            placeholder="https://example.com/bot" 
                            required
                            autocomplete="off"
                        >
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <span>➕</span> Add Bot
                    </button>
                </form>
            </div>
            
            <div class="settings-section">
                <h3>Manage Bots</h3>
                <div id="bots-list" class="bots-list">
                    <!-- Dynamically generated bot management items -->
                </div>
            </div>
            
            <div class="settings-section">
                <h3>Active Bots Status</h3>
                <div id="active-bots-list" class="active-bots-list">
                    <p class="no-active-bots">No bots currently running</p>
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script defer src="app.js"></script>
</body>
</html>
